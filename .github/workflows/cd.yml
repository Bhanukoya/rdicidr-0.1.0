name: CI Pipeline

on: 
  pull_request:
    branches:
      - devel
      - stage
      - prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Check out code
        uses: actions/checkout@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Azure Login action
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: github.ref == 'refs/heads/devel'
        run: terraform plan -var-file=environments/devel.tfvars
        working-directory: ./terraform
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/devel'
        run: terraform apply -var-file=environments/devel.tfvars -auto-approve
        working-directory: ./terraform

      - name: Terraform Plan
        if: github.ref == 'refs/heads/stage'
        run: terraform plan -var-file=environments/stage.tfvars
        working-directory: ./terraform
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/stage'
        run: terraform apply -var-file=environments/stage.tfvars -auto-approve
        working-directory: ./terraform

      - name: Terraform Plan
        if: github.ref == 'refs/heads/prod'
        run: terraform plan -var-file=environments/prod.tfvars
        working-directory: ./terraform
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/prod'
        run: terraform apply -var-file=environments/prod.tfvars -auto-approve
        working-directory: ./terraform
